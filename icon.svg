<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc" color="#000">
  <title id="title">Flow game engine logo</title>
  <desc id="desc">Minimal geometric Flow logo with a flowing F-shaped mark and custom vector wordmark.</desc>

  <!-- Change the `color` attribute on <svg> to recolor the entire logo. -->
  <g fill="currentColor">
    <!-- Flow mark -->
    <g id="mark">
      <path d="M356 371 392 284c29-70 93-112 171-112h344l-18 50c-14 39-49 61-93 61H570c-61 0-113 24-153 68l-18 20Z"/>
      <path d="M292 596 337 485c35-86 113-140 210-140h292l-18 51c-14 40-49 62-94 62H571c-65 0-116 29-143 86l-24 52Z"/>
    </g>

    <!-- Custom wordmark: no font dependency -->
    <g id="wordmark" transform="translate(0 4)">
      <!-- F -->
      <path d="M213 650h174v38H253v52h121v38H253v92h-40Z"/>

      <!-- l -->
      <path d="M414 650h40v220h-40Z"/>

      <!-- o -->
      <path fill-rule="evenodd" d="M500 787a82 70 0 1 0 164 0 82 70 0 1 0-164 0Zm40 0a42 35 0 1 1 84 0 42 35 0 1 1-84 0Z"/>

      <!-- w -->
      <path d="M690 704h43l37 111 42-111h37l42 111 37-111h43l-58 166h-43l-40-103-40 103h-43Z"/>
    </g>
  </g>
</svg>
